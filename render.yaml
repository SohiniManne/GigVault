# Render Blueprint — deploy API as a Web Service
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gigvault-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
